[project]
name = "station-health"
version = "0.1.0"
description = "Station Health Service: scores EV charging Stations' network hygiene from Collector Health Reports."
requires-python = ">=3.12,<3.13"
dependencies = [
    "flask==3.1.3",
    "flask-smorest==0.47.0",
    "marshmallow==4.3.1",
    "flask-sqlalchemy==3.1.1",
    "sqlalchemy==2.1.1",
    "flask-migrate==4.1.0",
    "pymysql==1.2.3",
    "cryptography==50.0.2",
    "gunicorn==26.2.0",
]

[dependency-groups]
dev = [
    "pytest==9.1.1",
    "testcontainers[mysql]==4.15.0",
    "openapi-spec-validator==0.9.0",
    "ruff==0.16.9",
    "mypy==2.3.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/station_health"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]
extend-exclude = ["src/station_health/migrations"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["station_health", "tests"]
mypy_path = "src"
exclude = ["src/station_health/migrations/"]

# flask-smorest's route decorators are untyped.
[[tool.mypy.overrides]]
module = ["station_health.*.routes"]
disallow_untyped_decorators = false

[[tool.mypy.overrides]]
module = ["flask_smorest.*", "flask_migrate.*", "testcontainers.*", "openapi_spec_validator.*"]
ignore_missing_imports = true
