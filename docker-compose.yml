services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-station_health}
      MYSQL_USER: ${MYSQL_USER:-station_health}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-station_health}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root}
    ports:
      - "${MYSQL_PORT:-3306}:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "--silent"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s

  api:
    build: .
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: ${DATABASE_URL:-mysql+pymysql://station_health:station_health@mysql:3306/station_health}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      API_KEYS_INGEST: ${API_KEYS_INGEST:-dev-ingest-key}
      API_KEYS_READ: ${API_KEYS_READ:-dev-read-key}
      API_KEYS_ADMIN: ${API_KEYS_ADMIN:-dev-admin-key}
      # Local only: the dashboard page carries this read-only key. Leave unset anywhere real.
      DASHBOARD_DEMO_KEY: ${DASHBOARD_DEMO_KEY:-dev-read-key}
    ports:
      - "${API_PORT:-8000}:8000"
    depends_on:
      mysql:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/readyz')"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Same image as the API, a different command: a scoring run every WORKER_INTERVAL_SECONDS.
  worker:
    build: .
    command: ["python", "-m", "station_health.worker"]
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: ${DATABASE_URL:-mysql+pymysql://station_health:station_health@mysql:3306/station_health}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    depends_on:
      # The API container applies migrations before it reports healthy.
      api:
        condition: service_healthy
    restart: unless-stopped

  # Optional: plays the Collector. Start it with `make simulate` or
  # `docker compose --profile simulator up -d simulator`.
  simulator:
    build: .
    profiles: ["simulator"]
    # Talks to the API only, so it skips the migrations the default entrypoint runs.
    entrypoint: ["python", "-m", "station_health.simulator"]
    command: []
    env_file:
      - path: .env
        required: false
    environment:
      SIM_API_URL: http://api:8000
      SIM_INGEST_KEY: ${SIM_INGEST_KEY:-dev-ingest-key}
      SIM_ADMIN_KEY: ${SIM_ADMIN_KEY:-dev-admin-key}
      SIM_STATIONS: ${SIM_STATIONS:-50}
      SIM_SPEED: ${SIM_SPEED:-60}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

volumes:
  mysql-data:
